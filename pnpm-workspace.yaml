blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - '@esbuild/*'
  - esbuild
  - '@next/env@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - next@16.3.4
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
onlyBuiltDependencies:
  - core-js
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
# 2026-06-12: security overrides for transitive advisories. Remove after
# upstream deps carry patched postcss >=8.5.10, vite >=7.3.2, esbuild >=0.28.1.
overrides:
  esbuild: 0.28.1
  postcss: 8.5.15
  vite: 7.3.2
