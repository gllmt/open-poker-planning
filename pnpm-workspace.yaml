blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - '@esbuild/*'
  - esbuild
  - '@next/env@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - next@16.3.4
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
onlyBuiltDependencies:
  - core-js
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
# Keep esbuild patched until all transitive ranges include this release.
overrides:
  esbuild: 0.28.1
