blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - '@esbuild/*'
  - esbuild
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
onlyBuiltDependencies:
  - core-js
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
# 2026-06-12: security overrides for transitive advisories. Remove after
# upstream deps carry patched postcss >=8.5.10, vite >=7.3.2, esbuild >=0.28.1.
overrides:
  esbuild: 0.28.1
  postcss: 8.5.15
  vite: 7.3.2
